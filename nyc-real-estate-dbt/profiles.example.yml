# Copy this into ~/.dbt/profiles.yml and fill in your own BigQuery details.
# This project targets Google BigQuery.
nyc_real_estate:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account          # or "oauth" for local dev
      project: your-gcp-project-id     # e.g. cis-9440-project-478801
      dataset: nyc_real_estate_dev     # where dbt writes models
      keyfile: /path/to/service-account.json   # omit if using oauth
      location: US
      threads: 4
      priority: interactive
